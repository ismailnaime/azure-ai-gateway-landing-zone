name: Terraform dev destroy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  destroy:
    name: Plan and destroy dev environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra/environments/dev

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Create saved destroy plan
        run: terraform plan -destroy -input=false -no-color -out=destroy.plan

      - name: Upload saved destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-destroy-plan-${{ github.run_id }}
          path: infra/environments/dev/destroy.plan
          if-no-files-found: error
          retention-days: 5

      - name: Apply destroy plan
        run: terraform apply -input=false -no-color destroy.plan
