name: Terraform dev apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Run ID of the completed Terraform dev plan on main (artifact retained for 5 days)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: Apply saved plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    defaults:
      run:
        working-directory: infra/environments/dev

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Get the planned commit
        id: plan
        uses: actions/github-script@v7
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        with:
          script: |
            const runId = Number(process.env.PLAN_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("plan_run_id must be a positive GitHub Actions run ID.");
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            core.setOutput("head_sha", run.head_sha);

      - name: Check out the planned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.head_sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Download saved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan-${{ inputs.plan_run_id }}
          path: infra/environments/dev
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Apply saved plan
        run: terraform apply -input=false -no-color planfile
